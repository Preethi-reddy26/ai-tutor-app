<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preethi's AI Tutor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00ff88, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #6b6b80;
            font-size: 13px;
            margin-top: 4px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            background: #14141f;
            border: 1px solid #1e1e2e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .user-message {
            background: #0ea5e9;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: #1e1e2e;
            color: #e8e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2e2e3e;
        }

        .typing {
            background: #1e1e2e;
            color: #6b6b80;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2e2e3e;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            background: #14141f;
            border: 1px solid #2e2e3e;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #00ff88;
        }

        input::placeholder {
            color: #6b6b80;
        }

        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #00ff88, #0ea5e9);
            border: none;
            border-radius: 10px;
            color: #0f0f1a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Tutor</h1>
            <p>My personal AI and ML learning assistant</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                 Hi Preethi! I'm your AI tutor. Ask me anything about AI and ML!
            </div>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask me anything about AI or ML..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            />
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const text = input.value.trim();
            
            if (!text) return;

            // Show user message
            chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
            input.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            chatBox.innerHTML += `<div class="message typing" id="typing">AI is thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                
                // Remove typing indicator
                document.getElementById('typing').remove();
                
                // Show AI response
                chatBox.innerHTML += `<div class="message ai-message">${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                document.getElementById('typing').remove();
                chatBox.innerHTML += `<div class="message ai-message">Sorry, something went wrong. Try again!</div>`;
            }

            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
